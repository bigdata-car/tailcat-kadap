<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">tailcat client server flow</title>
  <desc id="desc">Handwritten-style diagram showing client, encrypted Tailcat link, remote server, and optional Cloudflare Quick Tunnel.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#263238" stroke-width="2"/></marker>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="8" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer><feBlend in="SourceGraphic" in2="gray" mode="multiply"/></filter>
  </defs>
  <rect width="1100" height="560" fill="#fffdf4"/>
  <g filter="url(#paper)" fill="none" stroke="#263238" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 70 Q180 52 310 70 L305 350 Q180 365 52 348 Z" fill="#dff3ff" transform="rotate(-1 180 210)"/>
    <path d="M770 70 Q905 54 1044 73 L1040 350 Q900 364 768 347 Z" fill="#e4f7e7" transform="rotate(1 900 210)"/>
    <path d="M415 198 C500 165 600 165 690 198" stroke="#3568a8" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
    <path d="M685 245 C600 276 500 276 415 245" stroke="#3568a8" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
    <path d="M910 360 C910 420 790 420 740 450" stroke="#d27639" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
    <path d="M750 442 q55 -50 120 0 q55 50 120 0" stroke="#d27639"/>
  </g>
  <g fill="#263238" font-family="Comic Sans MS, Bradley Hand, cursive">
    <text x="92" y="116" font-size="32" font-weight="bold">클라이언트</text>
    <text x="92" y="164" font-size="22">tailcat start</text>
    <text x="92" y="202" font-size="22">127.0.0.1:3001</text>
    <text x="92" y="244" font-size="20">로컬 앱 / 브라우저</text>
    <text x="92" y="305" font-size="19">암호화된 포워딩</text>
    <text x="792" y="116" font-size="32" font-weight="bold">원격 서버</text>
    <text x="792" y="164" font-size="22">tailcat serve</text>
    <text x="792" y="202" font-size="22">127.0.0.1:3000</text>
    <text x="792" y="244" font-size="20">내부 웹 서비스</text>
    <text x="485" y="150" font-size="22" fill="#3568a8">Tailcat tunnel</text>
    <text x="438" y="322" font-size="22" fill="#d27639">tailcat tunnel 3000</text>
    <text x="735" y="510" font-size="23" fill="#a6531f">Cloudflare Quick Tunnel</text>
    <text x="748" y="540" font-size="19" fill="#a6531f">임시 공개 HTTPS URL</text>
  </g>
</svg>
